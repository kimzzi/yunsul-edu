<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스마트 재고 및 대여 관리 시스템</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Flatpickr (Calendar CSS & JS) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link rel="stylesheet" href="https://npmcdn.com/flatpickr/dist/themes/airbnb.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://npmcdn.com/flatpickr/dist/l10n/ko.js"></script>

  <!-- Firebase SDKs (v9 Compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-storage-compat.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

  <!-- Navigation Header -->
  <header class="bg-indigo-600 text-white shadow-lg sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center gap-2">
        <i class="fa-solid fa-boxes-stacked text-2xl text-indigo-200"></i>
        <h1 class="text-xl font-bold tracking-tight">재고·대여 관리 시스템</h1>
      </div>
      
      <!-- Role Switch & Auth Status -->
      <div id="authNav" class="flex items-center gap-2">
        <div class="bg-indigo-700/60 p-1 rounded-lg flex text-xs sm:text-sm font-medium">
          <button id="btnRoleUser" onclick="switchRole('user')" class="px-3 py-1.5 rounded-md bg-white text-indigo-600 font-bold shadow-sm transition">사용자</button>
          <button id="btnRoleAdmin" onclick="switchRole('admin')" class="px-3 py-1.5 rounded-md text-indigo-100 hover:text-white transition">관리자</button>
        </div>
        <div id="userInfo" class="hidden items-center gap-2 ml-2">
          <span id="userName" class="text-xs bg-indigo-800 px-2.5 py-1 rounded-full hidden sm:inline-block font-medium"></span>
          <button onclick="handleLogout()" class="bg-red-500 hover:bg-red-600 text-white text-xs px-3 py-1.5 rounded-md transition font-medium">로그아웃</button>
        </div>
      </div>
    </div>
  </header>

  <!-- Login Section (Modal/View) -->
  <div id="loginSection" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl p-6 sm:p-8 w-full max-w-sm border border-slate-100 text-center">
      <div class="inline-flex p-4 bg-indigo-50 text-indigo-600 rounded-full mb-4">
        <i class="fa-solid fa-boxes-stacked text-3xl"></i>
      </div>
      <h2 class="text-2xl font-bold text-slate-800">환영합니다!</h2>
      <p class="text-sm text-slate-500 mt-1 mb-6">재고 및 대여 관리를 위해 Google 계정으로 로그인해 주세요.</p>
      
      <!-- Google Login Button -->
      <button onclick="handleGoogleLogin()" class="w-full flex items-center justify-center gap-3 bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 font-semibold py-3 px-4 rounded-xl transition duration-200 shadow-sm hover:shadow text-sm">
        <svg class="w-5 h-5" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        Google 계정으로 로그인
      </button>
    </div>
  </div>

  <!-- Main Content Container -->
  <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-6">

    <!-- Admin Header Bar -->
    <div id="adminControls" class="hidden justify-between items-center mb-6 bg-white p-4 rounded-xl shadow-sm border border-slate-200">
      <div>
        <span class="inline-block px-2.5 py-1 bg-amber-100 text-amber-800 text-xs font-bold rounded-md mr-2">ADMIN MODE</span>
        <span class="text-sm text-slate-600 hidden sm:inline">전체 재고 등록, 대여 관리 및 상태 변경이 가능합니다.</span>
      </div>
      <button onclick="openAddModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-sm font-semibold flex items-center gap-2 shadow transition">
        <i class="fa-solid fa-plus"></i> 신규 자재 등록
      </button>
    </div>

    <!-- Inventory Grid -->
    <section class="mb-10">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
          <i class="fa-solid fa-boxes-packing text-indigo-600"></i> 자재 및 재고 목록
          <span class="text-xs font-normal text-slate-400 ml-1">(가나다순)</span>
        </h2>
        <span id="itemCount" class="text-xs text-slate-500 bg-slate-200 px-2 py-1 rounded-full">총 0건</span>
      </div>
      
      <!-- Inventory Items List Grid -->
      <div id="inventoryGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
        <div class="col-span-full py-12 text-center text-slate-400">데이터를 불러오는 중입니다...</div>
      </div>
    </section>

    <!-- User Specific Section: My Rental Info -->
    <section id="userRentalSection" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5">
      <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
        <i class="fa-solid fa-clock-rotate-left text-indigo-600"></i> 나의 대여 현황
      </h2>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead class="bg-slate-100 text-slate-600 uppercase text-xs">
            <tr>
              <th class="py-3 px-4 rounded-l-lg">자재명</th>
              <th class="py-3 px-4">대여수량</th>
              <th class="py-3 px-4">대여기간</th>
              <th class="py-3 px-4 rounded-r-lg">입금상태 / 대여 관리</th>
            </tr>
          </thead>
          <tbody id="userRentalList" class="divide-y divide-slate-100">
            <tr>
              <td colspan="4" class="py-6 text-center text-slate-400">대여 내역이 없습니다.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- MODAL: Notice Popup (공지사항 팝업) -->
  <div id="noticeModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full p-6 border border-slate-100 relative overflow-hidden max-h-[90vh] flex flex-col">
      <div class="flex justify-between items-center pb-3 border-b border-slate-100 mb-4">
        <h3 class="text-lg font-bold text-indigo-600 flex items-center gap-2">
          <i class="fa-solid fa-bullhorn text-amber-500"></i> 주요 공지사항
        </h3>
        <button onclick="closeModal('noticeModal')" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
      </div>

      <!-- Notice Cards Container -->
      <div id="noticeContainer" class="space-y-4 overflow-y-auto pr-1">
        <!-- Dynamic Notice Items -->
      </div>

      <div class="mt-5 pt-3 border-t border-slate-100 flex justify-end">
        <button onclick="closeModal('noticeModal')" class="px-5 py-2 bg-indigo-600 text-white rounded-xl text-sm font-semibold hover:bg-indigo-700 transition">확인 및 닫기</button>
      </div>
    </div>
  </div>

  <!-- MODAL 1: Rent Modal (대여 신청) -->
  <div id="rentModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 border border-slate-100">
      <h3 class="text-lg font-bold text-slate-800 mb-1" id="rentModalTitle">자재 대여 신청</h3>
      <p class="text-xs text-slate-500 mb-4" id="rentModalSub">수량과 대여 기간을 입력해주세요.</p>
      
      <form onsubmit="handleRentSubmit(event)" class="space-y-4">
        <input type="hidden" id="rentItemId">
        
        <div id="adminBorrowerField" class="hidden">
          <label class="block text-xs font-semibold text-slate-600 mb-1">대여자명 / 이메일</label>
          <input type="text" id="rentBorrowerName" class="w-full px-3 py-2 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500" placeholder="홍길동">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">대여 수량</label>
          <input type="number" id="rentQuantity" min="1" required class="w-full px-3 py-2 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500" value="1">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">대여 기간 선택</label>
          <div class="relative">
            <input type="text" id="rentPeriod" required placeholder="시작일 ~ 종료일 선택" class="w-full px-3 py-2 border rounded-xl text-sm bg-white outline-none focus:ring-2 focus:ring-indigo-500 cursor-pointer pr-10">
            <i class="fa-regular fa-calendar absolute right-3 top-2.5 text-slate-400 pointer-events-none"></i>
          </div>
        </div>

        <div class="flex gap-2 pt-2">
          <button type="button" onclick="closeModal('rentModal')" class="w-1/2 py-2.5 bg-slate-100 text-slate-600 font-semibold rounded-xl text-sm hover:bg-slate-200">취소</button>
          <button type="submit" class="w-1/2 py-2.5 bg-indigo-600 text-white font-semibold rounded-xl text-sm hover:bg-indigo-700">대여 신청</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL 2: Add/Edit Inventory Modal (재고 등록/수정) -->
  <div id="itemModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl max-w-lg w-full p-6 border border-slate-100">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold text-slate-800" id="itemModalTitle">신규 자재 등록</h3>
        <button onclick="closeModal('itemModal')" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>

      <form onsubmit="handleItemSubmit(event)" class="space-y-3">
        <input type="hidden" id="editDocId">
        <input type="hidden" id="existingPhotoUrl">
        
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">자재 번호 (자동생성)</label>
          <input type="text" id="itemCode" readonly class="w-full px-3 py-2 bg-slate-100 border border-slate-200 rounded-xl text-sm font-mono text-slate-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">자재명</label>
          <input type="text" id="itemName" required class="w-full px-3 py-2 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">사진 파일 업로드</label>
          <input type="file" id="itemPhotoFile" accept="image/*" class="w-full px-3 py-1.5 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500 file:mr-4 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
          <p id="currentPhotoText" class="text-xs text-slate-400 mt-1 hidden">기존 이미지가 등록되어 있습니다. 변경 시에만 새로 파일 선택하세요.</p>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">자재 위치</label>
            <input type="text" id="itemLocation" required class="w-full px-3 py-2 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500" placeholder="A동 201호">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">재고 수량</label>
            <input type="number" id="itemQty" min="0" required class="w-full px-3 py-2 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500" value="10">
          </div>
        </div>

        <!-- 공지사항 체크박스 -->
        <div class="p-3 bg-amber-50 border border-amber-200 rounded-xl">
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" id="itemIsNotice" class="w-4 h-4 text-amber-600 rounded focus:ring-amber-500">
            <span class="text-xs font-bold text-amber-900">공지사항으로 등록 (사용자 로그인 시 팝업 노출)</span>
          </label>
        </div>

        <div class="flex gap-2 pt-4">
          <button type="button" id="btnDeleteItem" onclick="deleteItem()" class="hidden py-2.5 px-4 bg-red-100 text-red-600 font-semibold rounded-xl text-sm hover:bg-red-200">삭제</button>
          <button type="button" onclick="closeModal('itemModal')" class="flex-1 py-2.5 bg-slate-100 text-slate-600 font-semibold rounded-xl text-sm hover:bg-slate-200">취소</button>
          <button type="submit" id="btnSaveItem" class="flex-1 py-2.5 bg-emerald-600 text-white font-semibold rounded-xl text-sm hover:bg-emerald-700 flex justify-center items-center gap-2">
            <span>저장</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Javascript Logic -->
  <script>
    // ----------------------------------------------------
    // ★ 관리자 이메일 목록 설정 ★
    // ----------------------------------------------------
    const ADMIN_EMAILS = [
      "migosachuk79@gmail.com"
    ];

    // ----------------------------------------------------
    // 1. Firebase Configuration (yunsul-edu)
    // ----------------------------------------------------
    const firebaseConfig = {
      apiKey: "AIzaSyD3-3njuR5NBTLuo4qF7Xr9vgvW7ReSvi0",
      authDomain: "yunsul-edu.firebaseapp.com",
      projectId: "yunsul-edu",
      storageBucket: "yunsul-edu.firebasestorage.app",
      messagingSenderId: "246128654335",
      appId: "1:246128654335:web:465e9fa0450a43bce799ca",
      measurementId: "G-SC67GVEWXZ"
    };

    // Initialize Firebase
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();
    const storage = firebase.storage();

    // ----------------------------------------------------
    // 2. Global State & Calendar Setup
    // ----------------------------------------------------
    let currentRole = 'user'; // 'user' or 'admin'
    let currentUser = null;
    let inventoryItems = [];
    let calendarPicker = null;
    let noticePopupShown = false;
    let unsubscribeInventory = null;

    document.addEventListener("DOMContentLoaded", () => {
      calendarPicker = flatpickr("#rentPeriod", {
        mode: "range",
        locale: "ko",
        dateFormat: "Y-m-d",
        minDate: "today",
        separator: " ~ "
      });
      // 페이지 첫 진입 시 데이터 로드 시작
      loadInventory();
    });

    // ----------------------------------------------------
    // 3. Google Auth Handlers
    // ----------------------------------------------------
    function handleGoogleLogin() {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider).catch(error => {
        alert("구글 로그인 실패: " + error.message);
      });
    }

    function handleLogout() {
      auth.signOut();
      noticePopupShown = false;
      switchRole('user');
    }

    auth.onAuthStateChanged(user => {
      currentUser = user;
      const loginSection = document.getElementById('loginSection');
      const userInfo = document.getElementById('userInfo');
      const userName = document.getElementById('userName');

      if (user) {
        loginSection.classList.add('hidden');
        userInfo.classList.remove('hidden');
        userInfo.classList.add('flex');
        userName.textContent = user.displayName || user.email;
        // 사용자 바뀌면 공지사항 팝업 다시 노출 가능하도록 리셋
        noticePopupShown = false;
        renderUserRentals();
        checkAndShowNoticePopup();
      } else {
        loginSection.classList.remove('hidden');
        userInfo.classList.add('hidden');
      }
    });

    function isAdminUser() {
      if (!currentUser) return false;
      return ADMIN_EMAILS.includes(currentUser.email);
    }

    function switchRole(role) {
      if (role === 'admin' && !isAdminUser()) {
        alert("관리자 권한이 등록된 계정이 아닙니다.\n등록된 관리자 구글 계정으로 로그인해 주세요.");
        return;
      }

      currentRole = role;
      const btnUser = document.getElementById('btnRoleUser');
      const btnAdmin = document.getElementById('btnRoleAdmin');
      const adminControls = document.getElementById('adminControls');
      const userRentalSection = document.getElementById('userRentalSection');

      if (role === 'admin') {
        btnAdmin.className = "px-3 py-1.5 rounded-md bg-white text-indigo-600 font-bold shadow-sm transition";
        btnUser.className = "px-3 py-1.5 rounded-md text-indigo-100 hover:text-white transition";
        adminControls.classList.remove('hidden');
        adminControls.classList.add('flex');
        userRentalSection.classList.add('hidden');
      } else {
        btnUser.className = "px-3 py-1.5 rounded-md bg-white text-indigo-600 font-bold shadow-sm transition";
        btnAdmin.className = "px-3 py-1.5 rounded-md text-indigo-100 hover:text-white transition";
        adminControls.classList.add('hidden');
        userRentalSection.classList.remove('hidden');
      }
      renderInventory();
    }

    // ----------------------------------------------------
    // 4. Data Loading & Realtime Rendering
    // ----------------------------------------------------
    function loadInventory() {
      if (unsubscribeInventory) unsubscribeInventory();

      unsubscribeInventory = db.collection("inventory").onSnapshot(snapshot => {
        inventoryItems = [];
        snapshot.forEach(doc => {
          inventoryItems.push({ id: doc.id, ...doc.data() });
        });

        // 1. 자재목록 가나다순 정렬
        inventoryItems.sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ko'));

        renderInventory();
        renderUserRentals();
        checkAndShowNoticePopup();
      }, error => {
        console.error("Firestore error:", error);
        document.getElementById('inventoryGrid').innerHTML = `<div class="col-span-full py-12 text-center text-rose-500 font-bold">데이터를 불러오는 중 오류가 발생했습니다.<br>${error.message}</div>`;
      });
    }

    function checkAndShowNoticePopup() {
      if (noticePopupShown || !currentUser) return;

      const notices = inventoryItems.filter(item => item.isNotice);
      if (notices.length === 0) return;

      const container = document.getElementById('noticeContainer');
      container.innerHTML = notices.map(item => `
        <div class="border border-amber-200 bg-amber-50/50 rounded-xl p-3 flex flex-col sm:flex-row gap-3 items-center">
          ${item.photo ? `<img src="${item.photo}" class="w-24 h-24 object-cover rounded-lg border border-amber-200 flex-shrink-0" alt="${item.name}">` : ''}
          <div class="flex-1 text-left">
            <span class="inline-block px-2 py-0.5 bg-amber-200 text-amber-900 font-bold text-[10px] rounded mb-1">ANNOUNCEMENT</span>
            <h4 class="font-bold text-slate-800 text-base mb-1">${item.name}</h4>
            <p class="text-xs text-slate-600"><i class="fa-solid fa-location-dot text-rose-400 mr-1"></i>위치: ${item.location}</p>
            <p class="text-xs text-slate-600"><i class="fa-solid fa-boxes-stacked text-indigo-500 mr-1"></i>현재 남은 재고: ${item.qty}개</p>
          </div>
        </div>
      `).join('');

      noticePopupShown = true;
      document.getElementById('noticeModal').classList.remove('hidden');
    }

    function renderInventory() {
      const grid = document.getElementById('inventoryGrid');
      const countEl = document.getElementById('itemCount');
      grid.innerHTML = '';
      countEl.textContent = `총 ${inventoryItems.length}건`;

      if (inventoryItems.length === 0) {
        grid.innerHTML = `<div class="col-span-full py-12 text-center text-slate-400">등록된 자재가 없습니다.</div>`;
        return;
      }

      inventoryItems.forEach(item => {
        const card = document.createElement('div');
        card.className = "bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col hover:shadow-md transition relative";
        
        const imageClickAttr = (currentRole === 'admin') ? `onclick="openEditModal('${item.id}')"` : '';

        // 관리자 모드 대여 현황 및 삭제 버튼
        let rentalsHTML = '';
        if (currentRole === 'admin' && item.rentals && item.rentals.length > 0) {
          rentalsHTML = `
            <div class="mt-3 pt-3 border-t border-slate-100 space-y-2">
              <span class="text-xs font-bold text-slate-500">대여 현황</span>
              ${item.rentals.map((r, idx) => `
                <div class="bg-slate-50 p-2.5 rounded-lg text-xs space-y-1">
                  <div class="flex justify-between items-center font-semibold text-slate-700">
                    <span><i class="fa-regular fa-user mr-1"></i>${r.borrower}</span>
                    <div class="flex items-center gap-1">
                      <button onclick="togglePayment('${item.id}', ${idx})" class="px-2 py-0.5 rounded text-[10px] font-bold ${r.paid ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700 hover:bg-rose-200'}">
                        ${r.paid ? '입금 완료' : '미입금'}
                      </button>
                      <button onclick="deleteRental('${item.id}', ${idx})" class="text-rose-500 hover:text-rose-700 p-1 text-xs" title="대여 내역 삭제">
                        <i class="fa-solid fa-trash-can"></i>
                      </button>
                    </div>
                  </div>
                  <div class="text-slate-500"><i class="fa-regular fa-calendar-check mr-1"></i>${r.period} (수량: ${r.qty}개)</div>
                </div>
              `).join('')}
            </div>
          `;
        }

        card.innerHTML = `
          <div class="relative h-44 bg-slate-100 cursor-pointer overflow-hidden group" ${imageClickAttr}>
            <img src="${item.photo || 'https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?w=500'}" alt="${item.name}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" onerror="this.src='https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?w=500'">
            <span class="absolute top-3 left-3 bg-slate-900/70 backdrop-blur-md text-white text-[11px] font-mono px-2 py-1 rounded-md">${item.code}</span>
            ${item.isNotice ? `<span class="absolute top-3 right-3 bg-amber-500 text-white text-[10px] font-bold px-2 py-1 rounded-md shadow-sm"><i class="fa-solid fa-bullhorn mr-1"></i>공지</span>` : ''}
          </div>

          <div class="p-4 flex-1 flex flex-col justify-between">
            <div>
              <div class="flex justify-between items-start mb-1">
                <h3 class="font-bold text-slate-800 text-base line-clamp-1 cursor-pointer" ${imageClickAttr}>${item.name}</h3>
              </div>
              <p class="text-xs text-slate-500 mb-2"><i class="fa-solid fa-location-dot text-rose-400 mr-1"></i>위치: ${item.location}</p>
              
              <div class="flex items-center justify-between bg-slate-50 px-3 py-2 rounded-xl mb-2">
                <span class="text-xs text-slate-500 font-medium">재고 수량</span>
                <span class="text-sm font-extrabold ${item.qty > 0 ? 'text-indigo-600' : 'text-rose-500'}">${item.qty} 개</span>
              </div>

              ${rentalsHTML}
            </div>

            <div class="mt-4">
              <button onclick="openRentModal('${item.id}')" ${item.qty <= 0 ? 'disabled' : ''} class="w-full py-2 bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 text-white rounded-xl text-xs font-bold transition flex items-center justify-center gap-1">
                <i class="fa-solid fa-hand-holding"></i> ${item.qty > 0 ? '대여 신청' : '품절'}
              </button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function renderUserRentals() {
      const tbody = document.getElementById('userRentalList');
      if (!currentUser) return;

      let myRentals = [];
      inventoryItems.forEach(item => {
        if (item.rentals) {
          item.rentals.forEach((r, idx) => {
            if (r.userId === currentUser.uid || r.borrower === (currentUser.displayName || currentUser.email)) {
              myRentals.push({
                itemId: item.id,
                rentalIndex: idx,
                itemName: item.name,
                qty: r.qty,
                period: r.period,
                paid: r.paid
              });
            }
          });
        }
      });

      if (myRentals.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="py-6 text-center text-slate-400">대여 내역이 없습니다.</td></tr>`;
        return;
      }

      tbody.innerHTML = myRentals.map(r => `
        <tr class="hover:bg-slate-50 transition">
          <td class="py-3 px-4 font-semibold text-slate-800">${r.itemName}</td>
          <td class="py-3 px-4">${r.qty} 개</td>
          <td class="py-3 px-4 text-slate-600">${r.period}</td>
          <td class="py-3 px-4">
            <div class="flex items-center gap-2">
              <span class="px-2.5 py-1 rounded-full text-xs font-bold ${r.paid ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">
                ${r.paid ? '입금 완료' : '미입금'}
              </span>
              ${!r.paid ? `<button onclick="cancelUserRental('${r.itemId}', ${r.rentalIndex})" class="px-2.5 py-1 bg-rose-100 hover:bg-rose-200 text-rose-600 rounded-lg text-xs font-bold transition flex items-center gap-1">
                <i class="fa-solid fa-xmark"></i> 대여 취소
              </button>` : ''}
            </div>
          </td>
        </tr>
      `).join('');
    }

    // ----------------------------------------------------
    // 5. Handlers
    // ----------------------------------------------------
    function cancelUserRental(itemId, rentalIndex) {
      if (!confirm("대여 신청을 취소하시겠습니까? (취소 시 재고가 복구됩니다)")) return;

      const item = inventoryItems.find(i => i.id === itemId);
      if (!item || !item.rentals) return;

      const restoredQty = item.rentals[rentalIndex].qty || 0;
      item.rentals.splice(rentalIndex, 1);

      db.collection("inventory").doc(itemId).update({
        qty: (item.qty || 0) + restoredQty,
        rentals: item.rentals
      }).then(() => {
        alert("대여 신청이 성공적으로 취소되었습니다.");
      });
    }

    function deleteRental(docId, rentalIndex) {
      if (!confirm("해당 대여 내역을 삭제하시겠습니까? (대여했던 수량이 재고로 복구됩니다.)")) return;

      const item = inventoryItems.find(i => i.id === docId);
      if (!item || !item.rentals) return;

      const restoredQty = item.rentals[rentalIndex].qty || 0;
      item.rentals.splice(rentalIndex, 1);

      db.collection("inventory").doc(docId).update({
        qty: (item.qty || 0) + restoredQty,
        rentals: item.rentals
      });
    }

    function openRentModal(docId) {
      document.getElementById('rentItemId').value = docId;
      const borrowerField = document.getElementById('adminBorrowerField');
      
      if (currentRole === 'admin') {
        borrowerField.classList.remove('hidden');
      } else {
        borrowerField.classList.add('hidden');
      }

      if (calendarPicker) {
        calendarPicker.clear();
      }
      
      document.getElementById('rentModal').classList.remove('hidden');
    }

    function handleRentSubmit(e) {
      e.preventDefault();
      const docId = document.getElementById('rentItemId').value;
      const qty = parseInt(document.getElementById('rentQuantity').value);
      const period = document.getElementById('rentPeriod').value;
      const borrowerName = (currentRole === 'admin') 
        ? (document.getElementById('rentBorrowerName').value || '관리자 등록') 
        : (currentUser ? (currentUser.displayName || currentUser.email) : '사용자');

      if (!period.includes("~")) {
        alert("대여 기간의 시작일과 종료일을 캘린더에서 함께 선택해주세요.");
        return;
      }

      const item = inventoryItems.find(i => i.id === docId);
      if (!item || item.qty < qty) {
        alert("재고 수량이 부족합니다.");
        return;
      }

      const newRentals = item.rentals || [];
      newRentals.push({
        userId: currentUser ? currentUser.uid : 'anon',
        borrower: borrowerName,
        qty: qty,
        period: period,
        paid: false
      });

      db.collection("inventory").doc(docId).update({
        qty: item.qty - qty,
        rentals: newRentals
      }).then(() => {
        closeModal('rentModal');
        alert("대여가 정상적으로 등록되었습니다.");
      });
    }

    function togglePayment(docId, rentalIndex) {
      const item = inventoryItems.find(i => i.id === docId);
      if (!item || !item.rentals) return;

      item.rentals[rentalIndex].paid = !item.rentals[rentalIndex].paid;

      db.collection("inventory").doc(docId).update({
        rentals: item.rentals
      });
    }

    function openAddModal() {
      document.getElementById('itemModalTitle').textContent = "신규 자재 등록";
      document.getElementById('editDocId').value = "";
      document.getElementById('existingPhotoUrl').value = "";
      document.getElementById('itemCode').value = "MAT-" + Math.floor(1000 + Math.random() * 9000);
      document.getElementById('itemName').value = "";
      document.getElementById('itemPhotoFile').value = "";
      document.getElementById('currentPhotoText').classList.add('hidden');
      document.getElementById('itemLocation').value = "";
      document.getElementById('itemQty').value = "10";
      document.getElementById('itemIsNotice').checked = false;
      document.getElementById('btnDeleteItem').classList.add('hidden');
      
      document.getElementById('itemModal').classList.remove('hidden');
    }

    function openEditModal(docId) {
      const item = inventoryItems.find(i => i.id === docId);
      if (!item) return;

      document.getElementById('itemModalTitle').textContent = "자재 내용 수정";
      document.getElementById('editDocId').value = docId;
      document.getElementById('existingPhotoUrl').value = item.photo || "";
      document.getElementById('itemCode').value = item.code;
      document.getElementById('itemName').value = item.name;
      document.getElementById('itemPhotoFile').value = "";
      document.getElementById('currentPhotoText').classList.remove('hidden');
      document.getElementById('itemLocation').value = item.location;
      document.getElementById('itemQty').value = item.qty;
      document.getElementById('itemIsNotice').checked = !!item.isNotice;
      document.getElementById('btnDeleteItem').classList.remove('hidden');

      document.getElementById('itemModal').classList.remove('hidden');
    }

    async function handleItemSubmit(e) {
      e.preventDefault();
      const saveBtn = document.getElementById('btnSaveItem');
      saveBtn.disabled = true;
      saveBtn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> 저장 중...`;

      try {
        const docId = document.getElementById('editDocId').value;
        const fileInput = document.getElementById('itemPhotoFile');
        let photoUrl = document.getElementById('existingPhotoUrl').value;

        if (fileInput.files.length > 0) {
          const file = fileInput.files[0];
          const storageRef = storage.ref(`inventory/${Date.now()}_${file.name}`);
          
          // 업로드 프로미스
          const snapshot = await storageRef.put(file);
          photoUrl = await snapshot.ref.getDownloadURL();
        }

        const data = {
          code: document.getElementById('itemCode').value,
          name: document.getElementById('itemName').value,
          photo: photoUrl,
          location: document.getElementById('itemLocation').value,
          qty: parseInt(document.getElementById('itemQty').value),
          isNotice: document.getElementById('itemIsNotice').checked
        };

        if (docId) {
          await db.collection("inventory").doc(docId).update(data);
        } else {
          data.rentals = [];
          await db.collection("inventory").add(data);
        }
        closeModal('itemModal');
        alert("성공적으로 저장되었습니다!");
      } catch (err) {
        console.error("Storage / Firestore Error:", err);
        alert("저장 실패: Firebase 권한 설정(Rules)을 확인해 주세요.\n오류내용: " + err.message);
      } finally {
        saveBtn.disabled = false;
        saveBtn.innerHTML = `<span>저장</span>`;
      }
    }

    function deleteItem() {
      const docId = document.getElementById('editDocId').value;
      if (docId && confirm("해당 자재를 정말 삭제하시겠습니까?")) {
        db.collection("inventory").doc(docId).delete().then(() => closeModal('itemModal'));
      }
    }

    function closeModal(id) {
      document.getElementById(id).classList.add('hidden');
    }
  </script>
</body>
</html>
