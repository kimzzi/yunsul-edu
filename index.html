<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>yunsul-edu - Base64 이미지 업로드</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 30px auto;
      padding: 0 20px;
    }
    .upload-card, .item-card {
      border: 1px solid #ccc;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input[type="text"], input[type="file"] {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
    }
    button {
      padding: 10px 20px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:disabled {
      background-color: #cccccc;
    }
    #previewImg {
      max-width: 200px;
      margin-top: 10px;
      display: none;
      border: 1px solid #ddd;
    }
    .list-img {
      max-width: 300px;
      height: auto;
      display: block;
      margin-top: 10px;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <h1>yunsul-edu 데이터 등록 및 조회</h1>

  <!-- 등록 폼 -->
  <div class="upload-card">
    <h2>새 사진 등록</h2>
    <form id="uploadForm">
      <div class="form-group">
        <label for="title">제목</label>
        <input type="text" id="title" placeholder="제목을 입력하세요" required>
      </div>
      <div class="form-group">
        <label for="imageFile">사진 선택</label>
        <input type="file" id="imageFile" accept="image/*" required>
        <img id="previewImg" alt="미리보기">
      </div>
      <button type="submit" id="submitBtn">업로드</button>
    </form>
  </div>

  <!-- 목록 표시 -->
  <h2>등록된 데이터 목록</h2>
  <div id="itemList">
    <p>데이터를 불러오는 중...</p>
  </div>

  <!-- Firebase SDK (v10 이상 모듈 방식) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      getDocs, 
      query, 
      orderBy, 
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 1. 本人의 Firebase 프로젝트 설정 정보를 넣으세요.
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // Firebase 초기화
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // DOM 요소
    const uploadForm = document.getElementById('uploadForm');
    const imageFileInput = document.getElementById('imageFile');
    const previewImg = document.getElementById('previewImg');
    const submitBtn = document.getElementById('submitBtn');
    const itemList = document.getElementById('itemList');

    let base64ImageStr = "";

    // [미리보기 & 이미지 리사이징/Base64 변환]
    imageFileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.src = event.target.result;
        img.onload = () => {
          // 이미지 자동 리사이징 (최대 너비/높이 800px로 제한하여 Firestore 1MB 제한 방지)
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 800;
          const MAX_HEIGHT = 800;
          let width = img.width;
          let height = img.height;

          if (width > height) {
            if (width > MAX_WIDTH) {
              height *= MAX_WIDTH / width;
              width = MAX_WIDTH;
            }
          } else {
            if (height > MAX_HEIGHT) {
              width *= MAX_HEIGHT / height;
              height = MAX_HEIGHT;
            }
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('canvas');
          ctx.drawImage(img, 0, 0, width, height);

          // 압축된 Base64 데이터 추출 (JPEG 형식, 품질 0.7)
          base64ImageStr = canvas.toDataURL('image/jpeg', 0.7);

          // 미리보기 표시
          previewImg.src = base64ImageStr;
          previewImg.style.display = 'block';
        };
      };
      reader.readAsDataURL(file);
    });

    // [데이터 저장]
    uploadForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const title = document.getElementById('title').value;

      if (!base64ImageStr) {
        alert("사진을 선택해주세요.");
        return;
      }

      try {
        submitBtn.disabled = true;
        submitBtn.innerText = "저장 중...";

        // 'yunsul-edu' 컬렉션에 저장
        await addDoc(collection(db, "yunsul-edu"), {
          title: title,
          imageBase64: base64ImageStr,
          createdAt: serverTimestamp()
        });

        alert("성공적으로 등록되었습니다!");
        
        // 폼 초기화
        uploadForm.reset();
        previewImg.style.display = 'none';
        base64ImageStr = "";

        // 목록 다시 불러오기
        fetchItems();

      } catch (error) {
        console.error("저장 중 오류 발생:", error);
        alert("등록 실패: " + error.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "업로드";
      }
    });

    // [데이터 목록 불러오기]
    async function fetchItems() {
      try {
        itemList.innerHTML = "<p>불러오는 중...</p>";

        // 최신순 정렬 Query
        const q = query(collection(db, "yunsul-edu"), orderBy("createdAt", "desc"));
        const querySnapshot = await getDocs(q);

        if (querySnapshot.empty) {
          itemList.innerHTML = "<p>등록된 데이터가 없습니다.</p>";
          return;
        }

        itemList.innerHTML = "";
        querySnapshot.forEach((doc) => {
          const data = doc.data();
          const card = document.createElement('div');
          card.className = 'item-card';

          const titleEl = document.createElement('h3');
          titleEl.textContent = data.title;

          const imgEl = document.createElement('img');
          imgEl.src = data.imageBase64; // Base64 문자열을 그대로 src에 대입
          imgEl.className = 'list-img';
          imgEl.alt = data.title;

          card.appendChild(titleEl);
          card.appendChild(imgEl);
          itemList.appendChild(card);
        });

      } catch (error) {
        console.error("불러오기 오류:", error);
        itemList.innerHTML = `<p style="color:red;">오류 발생: ${error.message}</p>`;
      }
    }

    // 페이지 진입 시 목록 불러오기 실행
    fetchItems();
  </script>
</body>
</html>
